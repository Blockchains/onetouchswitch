# Self-hosted stack. Core (Stage 1) needs only `app` with staged data. Everything else is optional and private.
services:
  app:
    build: .
    ports: ["127.0.0.1:8787:8787"]
    volumes: ["ots-data:/app/data"]
    environment:
      POSTCODES_IO_URL: ${POSTCODES_IO_URL:-}      # e.g. http://postcodes-api:8000 when the postcodes profile is up
      LIBPOSTAL_URL: ${LIBPOSTAL_URL:-}            # e.g. http://libpostal:4400 (normalisation only)
      REDIS_URL: ${REDIS_URL:-}                    # e.g. redis://redis:6379 (Stage 2)
      BILLS_ENABLED: ${BILLS_ENABLED:-0}
  # --- Stage 2: private bill OCR (browser never talks to Docling) ---
  redis:
    image: redis:7-alpine
    profiles: ["bills"]
    command: ["redis-server", "--appendonly", "yes"]
  worker:
    build: .
    profiles: ["bills"]
    command: ["node", "server/worker.mjs"]
    volumes: ["ots-data:/app/data"]
    environment: { REDIS_URL: "redis://redis:6379", DOCLING_URL: "http://docling:5001" }
    depends_on: [redis, docling]
  docling:
    image: quay.io/docling-project/docling-serve-cpu:latest
    profiles: ["bills"]
    expose: ["5001"]            # private network only, no host port
  # --- Optional: self-hosted postcodes.io (adds Northern Ireland + lat/long) ---
  postcodes-db:
    image: idealpostcodes/postcodes.io.db:latest
    profiles: ["postcodes"]
  postcodes-api:
    image: idealpostcodes/postcodes.io:latest
    profiles: ["postcodes"]
    environment: { POSTGRES_HOST: postcodes-db, POSTGRES_USER: postgres, POSTGRES_PASSWORD: password, POSTGRES_DATABASE: postgres }
    depends_on: [postcodes-db]
    expose: ["8000"]
  # --- Optional: libpostal REST (normalisation, never verification) ---
  libpostal:
    image: pelias/libpostal-service:latest
    profiles: ["libpostal"]
    expose: ["4400"]
volumes:
  ots-data: {}
